[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular"
version = "1.0.0"
description = "Import CSV/TSV files into SQLite with type inference, empty-value policies and a schema report. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["csv", "tsv", "sqlite", "import", "schema", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Utilities",
]

[project.scripts]
tabular = "tabular.cli:main"

[tool.setuptools.packages.find]
include = ["tabular*"]
